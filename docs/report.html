<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today's commute</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><style>
.rlink{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;text-decoration:none;color:inherit;margin-bottom:12px;cursor:pointer;transition:border-color .15s,transform .15s}
.rlink:hover{border-color:var(--accent);transform:translateY(-1px)}
.rlink:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rlink h2{margin:0 0 4px}.rlink .meta{grid-column:1/-1}
.rl-side{display:flex;align-items:center;gap:10px;text-align:right}
.rl-go{margin-left:auto;background:transparent}
.back{margin-bottom:14px;display:inline-flex;gap:8px;align-items:center}
.hint{margin:0 0 12px}
@media(max-width:560px){.rlink{grid-template-columns:1fr}.rl-side{text-align:left}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 17a2 2 0 1 0 0 .01M19 7a2 2 0 1 0 0 .01"/><path d="M7 17h7a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5"/></symbol>
<symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v2M16 18v2"/><circle cx="8" cy="14.5" r=".6"/><circle cx="16" cy="14.5" r=".6"/></symbol>
<symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="13" r=".6"/><circle cx="16.5" cy="13" r=".6"/></symbol>
<symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 8h5l4.5 8.5M9 8 7.5 6H5M14 8l-3 8.5h-5.5"/></symbol>
<symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="m9 21 2.5-6-2-3 1-4 3-1 2 3 3 1M11.5 15l3.5 2 1 4M10 8 7 10"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-theme" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 16a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.500 9 3.500 3.500 0 0 1 17 16zM8 19l-1 2M12 19l-1 2M16 19l-1 2"/></symbol>
</defs></svg>
<main>
<header class="top"><div class="brand"><div class="logo"><svg class="ico"><use href="#i-logo"/></svg></div>
<div><h1>Today's commute</h1><p class="sub" id="meta">Loading...</p></div></div>
<div class="actions"><a class="btn" href="index.html"><svg class="ico"><use href="#i-map"/></svg><span class="btn-label">Routes &amp; map</span></a>
<button id="theme" aria-label="Toggle theme" title="Toggle theme"><svg class="ico"><use href="#i-theme"/></svg></button></div></header>
<div id="out"></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?` ${m%60} min`:""}`;
const tm=s=>new Date(s).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const ic=n=>`<svg class="ico"><use href="#i-${n}"/></svg>`;
const IC={transit:"bus",drive:"car",two_wheeler:"bike"};
const split=l=>{const m=/^(.*?)\s*\(option (\d+)\)$/i.exec(l);return m?{base:m[1],opt:m[2]}:{base:l,opt:null}};
const q=new URLSearchParams(location.search).get("d");
const ist=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata"}).format(new Date());
const get=u=>fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()});

// Merge back-to-back walking steps ("Walk 3 min", "Walk 2 min" -> "Walk 5 min")
function tidy(steps){const out=[];steps.forEach(s=>{const w=s.type==="walk"&&/Walk (\d+) min/.exec(s.text),p=out[out.length-1];
 if(w&&p&&p.type==="walk")p.min+=+w[1];else out.push(w?{type:"walk",min:+w[1],depart:""}:{...s})});return out}

// "Bus 046 AC from A to B (53 stops) toward C"
function parseStep(s){const m=/^(Bus|Train|Metro|Monorail|Transit)\s+(.*?)\s*from\s+(.+?)\s+to\s+(.+?)(?:\s+\((\d+) stops?\))?(?:\s+toward\s+(.+))?$/.exec(s.text);
 return m?{kind:m[1],line:m[2],from:m[3],to:m[4],stops:m[5],toward:m[6]}:null}

function stepHTML(s){
 if(s.type==="walk")return`<li><span class="node k-walk">${ic("walk")}</span><div class="sbody"><div class="top walkline">Walk ${s.min} min</div></div></li>`;
 const p=parseStep(s),k=["bus","train","metro","monorail"].includes(s.type)?s.type:"transit",icon=k==="bus"?"bus":"train";
 if(!p)return`<li><span class="node k-${k}">${ic(icon)}</span><div class="sbody"><div class="top"><strong>${esc(s.text)}</strong>${s.depart?`<span class="stime">${tm(s.depart)}</span>`:""}</div></div></li>`;
 return`<li><span class="node k-${k}">${ic(icon)}</span><div class="sbody">
  <div class="top k-${k}"><span class="badge"><span>${esc(p.kind)} ${esc(p.line)}</span></span>${p.stops?`<span class="pill">${p.stops} stops</span>`:""}${s.depart?`<span class="stime">Departs ${tm(s.depart)}</span>`:""}</div>
  <div class="route-line"><div class="fr"><em>From</em><strong>${esc(p.from)}</strong></div><div class="to"><em>To</em><strong>${esc(p.to)}</strong></div></div>
  ${p.toward?`<div class="note">Towards ${esc(p.toward)}</div>`:""}</div></li>`}

let firstOpen=[0];
function optHTML(o,i){
 const s=split(o.label),first=!!(o.steps&&o.steps.length)&&!firstOpen[0]&&(firstOpen[0]=1),cls=o.delay_minutes>=15?"bad":o.delay_minutes>=5?"warn":"ok",steps=tidy(o.steps||[]);
 const traffic=o.mode!=="transit"?`<span class="pill ${cls}">${o.delay_minutes?`+${o.delay_minutes} min traffic`:"Clear roads"}</span>`:"";
 const sub=o.mode!=="transit"&&o.delay_minutes?`${hm(o.no_traffic_minutes)} without traffic`:"door to door";
 return`<article class="card ocard ${i?"":"best"}"><div class="ohead"><div class="who"><span class="mi">${ic(IC[o.mode]||"bus")}</span>
  <div><div class="nm">${esc(s.base)}</div><div class="meta" style="margin-top:4px">${i?"":'<span class="pill accent">Fastest</span>'}${s.opt?`<span class="pill">Option ${s.opt}</span>`:""}</div></div></div>
  <div class="mins">${hm(o.minutes)}<small>${sub}</small></div></div>
  <div class="ometa"><span class="pill">${o.km} km</span>${traffic}</div>
  ${steps.length?`<details class="stepsbox"${first?" open":""}><summary><span>Step-by-step (${steps.filter(x=>x.type!=="walk").length} ride${steps.filter(x=>x.type!=="walk").length===1?"":"s"})</span>${ic("chev")}</summary><ol class="tl">${steps.map(stepHTML).join("")}</ol></details>`:""}</article>`}

let DATA=null;
const t12=t=>{const[h,m]=t.split(":").map(Number);return`${h%12||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`};
const tcls=o=>o.delay_minutes>=15?"bad":o.delay_minutes>=5?"warn":"ok";

// minimal card: only name, path, leave time and the fastest option
function listHTML(j){return j.routes.map(r=>{const b=r.options[0],w=r.weather;if(!b)return"";
 return`<a class="card rlink" href="#${encodeURIComponent(r.id)}" aria-label="Open details for ${esc(r.name)}"><div><h2>${esc(r.name)}</h2>
  <div class="leg">${ic("pin")}<b>${esc(r.origin)}</b><span>\u2192</span><b>${esc(r.destination)}</b></div></div>
  <div class="rl-side"><span class="mi">${ic(IC[b.mode]||"bus")}</span><div class="mins">${hm(b.minutes)}<small>${esc(split(b.label).base)}</small></div></div>
  <div class="meta"><span class="pill accent">${ic("clock")}Leave ${esc(t12(r.depart_time))}</span><span class="pill">Fastest</span>
  ${b.mode!=="transit"&&b.delay_minutes?`<span class="pill ${tcls(b)}">+${b.delay_minutes} min traffic</span>`:""}
  ${w&&w.rain_mm>0?`<span class="pill warn">${ic("rain")}Rain</span>`:""}<span class="pill rl-go">View details \u2192</span></div></a>`}).join("")}

// full detail for one route
function secHTML(r){const w=r.weather;firstOpen[0]=0;
 return`<section><div class="rhead"><div><h2>${esc(r.name)}</h2>
  <div class="leg">${ic("pin")}<b>${esc(r.origin)}</b><span>\u2192</span><b>${esc(r.destination)}</b></div></div>
  <div class="meta"><span class="pill accent">${ic("clock")}Leave ${esc(t12(r.depart_time))}</span>
  ${w?`<span class="pill ${w.rain_mm>0?"warn":""}">${ic(w.rain_mm>0?"rain":"sun")}${w.temp_c}\u00b0C${w.rain_mm>0?`, rain ${w.rain_mm} mm`:""}</span>`:""}</div></div>
  <div class="opts">${r.options.map(optHTML).join("")}</div>
  ${r.trains&&r.trains.length?`<div class="card infocard"><span class="mi">${ic("train")}</span><div><strong>Next local trains: ${esc(r.train_pair.from)} \u2192 ${esc(r.train_pair.to)}</strong>
   <div class="trains">${r.trains.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div><p class="sub">From the trainhelp.in timetable</p></div></div>`:""}</section>`}

// #route-id in the address shows that route; no hash shows the list
function render(){if(!DATA)return;const id=decodeURIComponent(location.hash.slice(1)),r=DATA.routes.find(x=>x.id===id);
 $("out").innerHTML=r?`<a class="btn back" href="#"><span aria-hidden="true">\u2190</span><span>All routes</span></a>`+secHTML(r)
  :`<p class="sub hint">${DATA.routes.length} route${DATA.routes.length===1?"":"s"} today. Select one for the full details.</p>`+listHTML(DATA);
 window.scrollTo(0,0)}
addEventListener("hashchange",render);

get(`data/reports/${encodeURIComponent(q||ist)}.json`).catch(()=>q?Promise.reject():get("data/latest.json")).then(j=>{
 DATA=j;$("meta").textContent=`${j.date}, updated ${tm(j.generated_at)}`;render()
}).catch(()=>{$("meta").textContent="";$("out").innerHTML='<div class="card empty">No report for this date yet. Reports appear after the morning alert is sent.</div>'});
const root=document.documentElement;root.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
$("theme").onclick=()=>{localStorage.theme=root.dataset.theme=root.dataset.theme==="dark"?"light":"dark"};
</script></body></html>
